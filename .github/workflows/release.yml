name: Build & Release

# 推送与 manifest.json 版本号相同的标签（如 1.0.1）时自动编译并发布；
# 也可在 Actions 页面手动运行，为已有标签补传文件。
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要补传文件的已有标签（如 1.0.0）"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --generate-notes
          fi
